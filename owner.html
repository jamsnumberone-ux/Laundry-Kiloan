<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Owner - Laundry</title>
    <link rel="stylesheet" href="owner.css">
    <script type="module" src="./owner.js" defer></script>
</head>
<body>
    <header>
        <h2>📊 Dashboard Owner</h2>
        <p>Laporan Keuangan & Laba Bersih</p>
        <button id="btn-logout" style="margin-top: 10px; padding: 5px 15px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">Keluar (Logout)</button>
    </header>

    <main>
        <!-- Kotak Ringkasan Statistik -->
        <section class="stats-container">
            <div class="stat-card">
                <p>Omzet Hari Ini</p>
                <h3 id="omzet-hari-ini">Rp 0</h3>
            </div>
            <div class="stat-card">
                <p>Omzet Bulan Ini (Kotor)</p>
                <h3 id="omzet-bulan-ini">Rp 0</h3>
            </div>
            <div class="stat-card warning">
                <p>Pengeluaran Bulan Ini</p>
                <h3 id="pengeluaran-bulan-ini" style="color: #ef4444;">Rp 0</h3>
            </div>
            <div class="stat-card success">
                <p>Laba Bersih Bulan Ini</p>
                <h3 id="laba-bersih" style="color: #10b981;">Rp 0</h3>
            </div>
            <div class="stat-card warning" style="border-left-color: #f59e0b;">
                <p>Total Belum Lunas (Piutang)</p>
                <h3 id="total-piutang">Rp 0</h3>
            </div>
        </section>

        <!-- Form Input Pengeluaran -->
        <section class="expense-section">
            <h3>💸 Catat Pengeluaran</h3>
            <form id="form-pengeluaran">
                <input type="text" id="nama-pengeluaran" placeholder="Contoh: Beli Rinso, Token Listrik, Plastik" required autocomplete="off">
                <input type="number" id="nominal-pengeluaran" placeholder="Nominal (Contoh: 50000)" required>
                <button type="submit" id="btn-simpan-pengeluaran">Simpan Pengeluaran</button>
            </form>
        </section>

        <!-- Bagian Riwayat Transaksi -->
        <section class="report-section">
            <h3>Semua Riwayat Pemasukan</h3>
            <div id="owner-report-list">
                <p style="text-align: center; color: #64748b;">Memuat data laporan...</p>
            </div>
        </section>
    </main>
</body>
</html>
