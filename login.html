<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Karyawan - Laundry</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #error-msg { color: red; font-size: 13px; display: none; margin-bottom: 10px; }
    </style>
    <script type="module" src="./login.js" defer></script>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Login Sistem</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Khusus Kasir & Owner</p>
        
        <div id="error-msg">Email atau password salah!</div>
        
        <form id="login-form">
            <input type="email" id="email" placeholder="Email Akun" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn-login">Masuk</button>
        </form>
    </div>
</body>
</html>
